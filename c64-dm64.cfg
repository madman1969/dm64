# cc65's c64.cfg (zlib licence), changed for Dungeon Master 64:
# - a 768-byte C stack instead of 2K
# - LOWBSS: buffers in the RAM of the C64's default screen ($0400-$07FF), free once the game
#   moves its screen into the RAM under the KERNAL (see src/hw.c). It isn't cleared at start-up.
# - overlays: five areas linked to run at the same address, below the stack, each written to its
#   own file (dm64.prg.1 to .5). The build pads them to OVLSIZE and joins them into DMOVL, which
#   the game keeps in far memory and copies in as needed (src/dungeon.c: overlay).
FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0300; # 768-byte stack
    __HIMEM__:     type = weak, value = $CC00; # the screen is at $CC00 (hw.c)
    __OVLSIZE__:   type = weak, value = $0A80; # the largest overlay (saving, 2.6K), rounded up
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    LOWRAM:   file = "",               start = $0400,           size = $0400;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = __HIMEM__ - __STACKSIZE__ - __OVLSIZE__ - __HEADER_LAST__;
    BSS:      file = "",               start = __ONCE_RUN__,    size = __HIMEM__ - __STACKSIZE__ - __OVLSIZE__ - __ONCE_RUN__;
    OVL1:     file = "%O.1", define = yes, start = __HIMEM__ - __STACKSIZE__ - __OVLSIZE__, size = __OVLSIZE__;
    OVL2:     file = "%O.2",           start = __HIMEM__ - __STACKSIZE__ - __OVLSIZE__, size = __OVLSIZE__;
    OVL3:     file = "%O.3",           start = __HIMEM__ - __STACKSIZE__ - __OVLSIZE__, size = __OVLSIZE__;
    OVL4:     file = "%O.4",           start = __HIMEM__ - __STACKSIZE__ - __OVLSIZE__, size = __OVLSIZE__;
    OVL5:     file = "%O.5",           start = __HIMEM__ - __STACKSIZE__ - __OVLSIZE__, size = __OVLSIZE__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOWBSS:   load = LOWRAM,   type = bss;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;  # uninitialized, but reserves output space
    ONCE:     load = MAIN,     type = ro,  define   = yes;
    BSS:      load = BSS,      type = bss, define   = yes;
    OVL1:     load = OVL1,     type = rw;
    OVL2:     load = OVL2,     type = rw;
    OVL3:     load = OVL3,     type = rw;
    OVL4:     load = OVL4,     type = rw;
    OVL5:     load = OVL5,     type = rw;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
